# Cross-platform wheel matrix. Wheels are uploaded as artifacts — no auto-
# publish. Trigger: push to master, PRs, and manual workflow_dispatch.
#
# Platforms target what `onyxweb-download-chrome` can stage a binary for:
# linux x86_64 / aarch64, darwin x86_64 / arm64, windows x86_64. Adding a
# platform requires both a matrix entry here AND a CFT_PLATFORM row in
# python/onyxweb/download.py.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Static gates: ruff, mypy strict, cargo fmt, cargo clippy. Fast — runs
    # on every PR / push to master alongside the wheel-build matrix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync dev deps (builds Rust ext via cache-keys)
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check python/ tests/
      - name: Mypy (strict)
        run: uv run mypy python/onyxweb/ tests/
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel (manylinux_2_28)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: "2_28"
          sccache: true
          # Built in the wheel's manylinux container, so the glibc baselines match.
          # No sccache yet here; aarch64 pyo3-ffi's build script needs a cross Python.
          before-script-linux: RUSTC_WRAPPER= PYO3_CROSS_PYTHON_VERSION=3.11 cargo build --release -p onyxweb_wrapper --bin onyxweb_wrapper
      - name: Inject onyxweb_wrapper into the wheel
        run: |
          python -m pip install --quiet wheel
          # Cross-compiled aarch64 lands under target/<triple>/release/, not target/release/.
          wrapper=$(find target -type f -name onyxweb_wrapper -path '*/release/*' | head -1)
          for whl in dist/*.whl; do
            python scripts/inject_wrapper.py "$whl" "$wrapper" linux_${{ matrix.target }} onyxweb_wrapper
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: true
      - name: Build onyxweb_wrapper
        run: cargo build --release -p onyxweb_wrapper --bin onyxweb_wrapper
      - name: Inject onyxweb_wrapper into the wheel
        run: |
          python -m pip install --quiet wheel
          wrapper=$(find target -type f -name onyxweb_wrapper -path '*/release/*' | head -1)
          for whl in dist/*.whl; do
            python scripts/inject_wrapper.py "$whl" "$wrapper" darwin_${{ matrix.target }} onyxweb_wrapper
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          sccache: true
      - name: Build onyxweb_wrapper
        run: cargo build --release -p onyxweb_wrapper --bin onyxweb_wrapper
      - name: Inject onyxweb_wrapper into the wheel
        shell: bash
        run: |
          python -m pip install --quiet wheel
          wrapper=$(find target -type f -name onyxweb_wrapper.exe -path '*/release/*' | head -1)
          for whl in dist/*.whl; do
            python scripts/inject_wrapper.py "$whl" "$wrapper" windows_x86_64 onyxweb_wrapper.exe
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test:
    # Smoke-test the linux x86_64 wheel end-to-end: install into a fresh venv,
    # fetch chrome-headless-shell via `onyxweb --install`, run
    # the default pytest suite. Skips the benchmark tests (-m 'not benchmark'
    # from pyproject addopts).
    needs: [linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          # onyxweb is already published at this exact version, so a bare
          # `pip install onyxweb` can resolve to PyPI instead of the local build.
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group dev
      - name: Fetch chrome-headless-shell
        run: onyxweb --install
      - name: Run default test suite
        run: pytest tests/

  test-macos:
    # Real-platform check for onyxweb_wrapper: installs
    # the actual built wheel and runs C7 lifecycle, including the regression test that
    # kills only the process holding a Client and checks Chrome's whole tree dies too.
    needs: [macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group dev
      - name: Fetch chrome-headless-shell
        run: onyxweb --install
      - name: Run C7 lifecycle tests
        run: pytest tests/test_c7_lifecycle.py -v

  test-windows:
    # See test-macos — same real-platform check, on windows-latest.
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group dev
      - name: Fetch chrome-headless-shell
        run: onyxweb --install
      - name: Run C7 lifecycle tests
        run: pytest tests/test_c7_lifecycle.py -v
