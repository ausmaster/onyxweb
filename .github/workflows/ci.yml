# Cross-platform wheel matrix. Wheels are uploaded as artifacts — no auto-
# publish. Trigger: push to master, PRs, and manual workflow_dispatch.
#
# Platforms target what `onyxweb-download-chrome` can stage a binary for:
# linux x86_64 / aarch64, darwin x86_64 / arm64, windows x86_64. Adding a
# platform requires both a matrix entry here AND a CFT_PLATFORM row in
# python/onyxweb/onyxweb/download.py.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Static gates: ruff, mypy strict, cargo fmt, cargo clippy. Fast — runs
    # on every PR / push to master alongside the wheel-build matrix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync dev deps (builds Rust ext via cache-keys)
        run: uv sync --all-packages --group dev
      # Each project lints on its own config; one mypy run over both would meet two `conftest` modules.
      - name: Ruff (onyxweb)
        working-directory: python/onyxweb
        run: uv run --no-sync ruff check .
      - name: Mypy strict (onyxweb)
        working-directory: python/onyxweb
        run: uv run --no-sync mypy onyxweb tests
      - name: Ruff (onyxweb-server)
        working-directory: python/server
        run: uv run --no-sync ruff check .
      - name: Mypy strict (onyxweb-server)
        working-directory: python/server
        run: uv run --no-sync mypy onyxweb_server tests
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel (manylinux_2_28)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: python/onyxweb
          args: --release --out ../../dist --find-interpreter
          manylinux: "2_28"
          sccache: true
          # Built in the wheel's manylinux container, so the glibc baselines match.
          # No sccache there yet, hence RUSTC_WRAPPER=.
          before-script-linux: |
            # Resolve the repo root from wherever this runs (maturin's working directory is python/onyxweb).
            ROOT="$(dirname "$(cargo locate-project --workspace --message-format plain)")"
            RUSTC_WRAPPER= cargo build --release --bin onyxweb_wrapper --no-default-features
            # aarch64 cross-compiles land under target/<triple>/release/.
            DEST="$ROOT/python/onyxweb/onyxweb/_binaries/linux_${{ matrix.target }}/wrapper"
            mkdir -p "$DEST"
            cp "$(find "$ROOT/target" -type f -name onyxweb_wrapper -path '*/release/*' | head -1)" "$DEST/"
      - name: Check the wrapper is in every wheel
        run: |
          for whl in dist/*.whl; do
            python -m zipfile -l "$whl" | grep -q "_binaries/linux_${{ matrix.target }}/wrapper/onyxweb_wrapper" \
              || { echo "wrapper missing from $whl"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and stage onyxweb_wrapper
        run: |
          cargo build --release --bin onyxweb_wrapper --no-default-features
          mkdir -p python/onyxweb/onyxweb/_binaries/darwin_${{ matrix.target }}/wrapper
          cp target/release/onyxweb_wrapper python/onyxweb/onyxweb/_binaries/darwin_${{ matrix.target }}/wrapper/
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: python/onyxweb
          args: --release --out ../../dist --find-interpreter
          sccache: true
      - name: Check the wrapper is in every wheel
        run: |
          for whl in dist/*.whl; do
            python -m zipfile -l "$whl" | grep -q "_binaries/darwin_${{ matrix.target }}/wrapper/onyxweb_wrapper" \
              || { echo "wrapper missing from $whl"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build and stage onyxweb_wrapper
        shell: bash
        run: |
          cargo build --release --bin onyxweb_wrapper --no-default-features
          mkdir -p python/onyxweb/onyxweb/_binaries/windows_x86_64/wrapper
          cp target/release/onyxweb_wrapper.exe python/onyxweb/onyxweb/_binaries/windows_x86_64/wrapper/
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          working-directory: python/onyxweb
          args: --release --out ../../dist --find-interpreter
          sccache: true
      - name: Check the wrapper is in every wheel
        shell: bash
        run: |
          for whl in dist/*.whl; do
            python -m zipfile -l "$whl" | grep -q "_binaries/windows_x86_64/wrapper/onyxweb_wrapper.exe" \
              || { echo "wrapper missing from $whl"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python/onyxweb
          args: --out ../../dist
      - name: Check the sdist holds the library and nothing else
        run: |
          for tgz in dist/*.tar.gz; do
            files=$(tar tzf "$tgz")
            # The sdist is the library: the crate and the Python package, with no tests, server or CI files.
            extra=$(echo "$files" | grep -E '/(python|tests|\.github)/|/uv\.lock$' || true)
            [ -z "$extra" ] || { echo "$tgz holds files that are not the library:"; echo "$extra" | head -5; exit 1; }
            # What a build needs is still there.
            for want in Cargo.toml Cargo.lock rust-toolchain.toml src/lib.rs pyproject.toml README.md LICENSE onyxweb/__init__.py; do
              echo "$files" | grep -q "^[^/]*/$want\$" || { echo "$want is missing from $tgz"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test:
    # Smoke-test the linux x86_64 wheel end-to-end: install into a fresh venv,
    # fetch both Chrome builds via `onyxweb --install`, run
    # each project's default pytest suite. Skips the benchmark tests (-m 'not benchmark'
    # from python/onyxweb/pyproject.toml addopts).
    needs: [linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          # onyxweb is already published at this exact version, so a bare
          # `pip install onyxweb` can resolve to PyPI instead of the local build.
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group python/onyxweb/pyproject.toml:dev
          python -m pip install --group python/server/pyproject.toml:dev
          python -m pip install ./python/server --no-deps
      - name: Fetch Chrome (both engines)
        run: onyxweb --install
      # One run per project, each from its own folder: both have a top-level conftest.py, and a
      # bare `pytest` keeps the source package out of sys.path, so the installed wheel is tested.
      - name: Run the onyxweb suite
        working-directory: python/onyxweb
        run: pytest
      - name: Run the onyxweb-server suite
        working-directory: python/server
        run: pytest

  test-macos:
    # Real-platform check for onyxweb_wrapper: installs
    # the actual built wheel and runs C7 lifecycle, including the regression test that
    # kills only the process holding a Client and checks Chrome's whole tree dies too.
    needs: [macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group python/onyxweb/pyproject.toml:dev
      - name: Fetch Chrome (both engines)
        run: onyxweb --install
      - name: Run C7 lifecycle tests
        working-directory: python/onyxweb
        run: pytest tests/test_c7_lifecycle.py -v

  test-windows:
    # See test-macos — same real-platform check, on windows-latest.
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist
      - name: Install wheel + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pydantic-settings
          python -m pip install onyxweb --no-index --no-deps --find-links dist --force-reinstall
          python -m pip install --group python/onyxweb/pyproject.toml:dev
      - name: Fetch Chrome (both engines)
        run: onyxweb --install
      - name: Run C7 lifecycle tests
        working-directory: python/onyxweb
        run: pytest tests/test_c7_lifecycle.py -v
