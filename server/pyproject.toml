[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onyxweb-server"
version = "0.1.0"
description = "Serve onyxweb's browser to agents over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "AusMaster", email = "ausmasterproductions@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Raise the floor to onyxweb 0.3 when its breaking changes ship; the workspace serves the local copy.
dependencies = ["onyxweb>=0.2.3"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/ausmaster/onyxweb"
Repository = "https://github.com/ausmaster/onyxweb"
Issues = "https://github.com/ausmaster/onyxweb/issues"

[project.scripts]
onyxweb-server = "onyxweb_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["onyxweb_server"]

[tool.uv.sources]
onyxweb = { workspace = true }
