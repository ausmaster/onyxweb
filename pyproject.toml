[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "onyxweb"
version = "0.2.3"
description = "Fast URL → fully-rendered HTML + optional screenshot for Python, powered by Chromium via CDP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AusMaster", email = "ausmasterproductions@gmail.com" }]
keywords = [
    "chromium", "cdp", "headless", "browser", "scraping",
    "screenshot", "rendering", "html", "anti-bot", "bbot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/ausmaster/onyxweb"
Repository = "https://github.com/ausmaster/onyxweb"
Issues = "https://github.com/ausmaster/onyxweb/issues"

[project.scripts]
onyxweb = "onyxweb.__main__:main"
onyxweb-download-chrome = "onyxweb.download:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    # Parity oracle for the Rust-side header/body hashes (BBOT uses mmh3).
    "mmh3>=4.0",
    # Cross-platform process tree walk/kill for the C7 parent-death regression test.
    "psutil>=6.0",
    # C13 and C14 test onyxweb-server, which needs the mcp package for its MCP front-end.
    "mcp>=1.2,<2",
]
bench = [
    "pytest>=8",
    "playwright>=1.49",
]

[tool.uv.workspace]
members = ["server"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = [
    # Google-convention conflicts with these pydocstyle defaults:
    "D203", # one-blank-line-before-class — google prefers D211
    "D213", # multi-line-summary-second-line — google prefers D212
    # __init__ args go in the class docstring under Google convention.
    "D107",
    # Magic methods (__repr__ etc.) don't need explicit docstrings.
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests get assert-style summaries; not full Google blocks.
"tests/*" = ["D"]
# Private modules: relax requirement on per-symbol docstrings.
"python/onyxweb/_logging.py" = ["D102", "D103", "D107"]
"python/onyxweb/download.py" = ["D103"]

[tool.ruff.lint.isort]
# Coalesce `from X import a as b, c as d` onto one block — keeps PEP 484
# explicit re-exports (`Dom as Dom`) compact and matches our import style:
# single block per module, multi-line when ≥5 symbols.
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.maturin]
python-source = "python"
module-name = "onyxweb._onyxweb"
features = ["pyo3/extension-module"]
# Chrome-headless-shell (~179 MB per platform) is NOT bundled into the wheel.
# Wheels stay small; end users fetch the pinned binary with `onyxweb --install`
# after install — mirrors Playwright's `playwright install` pattern.
# Scoped to just the cdylib: maturin cannot build a sibling bin into a pyo3 wheel.
targets = [{ name = "_onyxweb", kind = "cdylib" }]
# CI builds src/bin/onyxweb_wrapper.rs and stages it here before maturin runs;
# `include` bundles it despite .gitignore (needs maturin >= 1.12.1).
include = [{ path = "python/onyxweb/_binaries/*/wrapper/*", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
asyncio_mode = "auto"
markers = [
    "benchmark: performance regression tests",
    "real_sites: gauntlet tests against real production websites",
    "threading: multi-thread / concurrency tests",
]
