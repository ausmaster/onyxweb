# Virtual workspace root. Each project owns its own build, dependency groups, tool config and tests:
#   python/onyxweb  the library (maturin, Rust extension)   tests in python/onyxweb/tests
#   python/server   onyxweb-server (hatchling, pure Python) tests in python/server/tests

[tool.uv.workspace]
members = ["python/onyxweb", "python/server"]
