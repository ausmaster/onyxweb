[package]
name = "onyxweb"
version = "0.2.2"
edition = "2024"
publish = false

[lib]
name = "_onyxweb"
crate-type = ["cdylib", "lib"]

# chrome_executable() points here instead of the real binary, so Chrome dies when
# onyxweb's own process dies abruptly. No pyo3 — must never need libpython.
[[bin]]
name = "onyxweb_wrapper"
path = "src/bin/onyxweb_wrapper.rs"

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
# Bridges Rust async futures to Python awaitables. Pinned to pyo3's major.
pyo3-async-runtimes = { version = "0.25", features = ["tokio-runtime"] }

# Chromium via CDP — the new engine
chromiumoxide = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std"] }
futures = "0.3"

# Rust-side HTML query — backs RenderResult.dom. `atomic` makes `Html` Send so a
# parsed page can cross Python threads.
scraper = { version = "0.22", features = ["atomic"] }

# Response hashing (BBOT HTTP_RESPONSE parity). murmur3::murmur3_32(_, 0) as
# i32 reproduces Python mmh3.hash() byte-for-byte (verified in tests).
md-5 = "0.10"
sha2 = "0.10"
murmur3 = "0.5"

# Misc
url = "2"
# Percent-decode proxy user:pass extracted from a proxy URL (httpx parity).
percent-encoding = "2"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
# preserve_order: bucket records keep their declared field order (matches report
# `url` before `raw`) and JSON-LD keeps the key order the page wrote.
serde_json = { version = "1", features = ["preserve_order"] }
# Bucket search. Linear-time matching, so no user pattern can hang a scan.
regex = "1"

# onyxweb_wrapper's Linux self-protection (die_with_parent); macOS/Windows are hand-written.
[target.'cfg(target_os = "linux")'.dependencies]
ur-taking-me-with-you = "8"

# onyxweb_wrapper's macOS supervisor: kqueue/EVFILT_PROC has no safe wrapper elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# onyxweb_wrapper's Windows supervisor: process snapshot + job-object plumbing.
[target.'cfg(target_os = "windows")'.dependencies]
ur-taking-me-with-you = "8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
