[package]
name = "onyxweb"
version = "0.3.0"
edition = "2024"
publish = false
# The sdist is the library: the crate, and the Python package maturin adds itself.
exclude = ["/python", "/.github", "/uv.lock", "/BENCHMARKS.md", "/.python-version", "/.gitignore"]

[lib]
name = "_onyxweb"
crate-type = ["cdylib"]

[features]
default = ["extension"]
# The Python extension. The wrapper binary builds with --no-default-features.
extension = [
    "dep:pyo3",
    "dep:pyo3-async-runtimes",
    "dep:chromiumoxide",
    "dep:tokio",
    "dep:futures",
    "dep:scraper",
    "dep:md-5",
    "dep:sha2",
    "dep:murmur3",
    "dep:url",
    "dep:percent-encoding",
    "dep:thiserror",
    "dep:log",
    "dep:env_logger",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:serde",
    "dep:serde_json",
    "dep:regex",
]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
# Bridges Rust async futures to Python awaitables. Pinned to pyo3's major.
pyo3-async-runtimes = { version = "0.25", features = ["tokio-runtime"], optional = true }

# Chromium via CDP — the new engine
chromiumoxide = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std"], optional = true }
futures = { version = "0.3", optional = true }

# Rust-side HTML query — backs RenderResult.dom. `atomic` makes `Html` Send so a
# parsed page can cross Python threads.
scraper = { version = "0.22", features = ["atomic"], optional = true }

# Response hashing (BBOT HTTP_RESPONSE parity). murmur3::murmur3_32(_, 0) as
# i32 reproduces Python mmh3.hash() byte-for-byte (verified in tests).
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
murmur3 = { version = "0.5", optional = true }

# Misc
url = { version = "2", optional = true }
# Percent-decode proxy user:pass extracted from a proxy URL (httpx parity).
percent-encoding = { version = "2", optional = true }
thiserror = { version = "2", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
once_cell = { version = "1", optional = true }
parking_lot = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# preserve_order: bucket records keep their declared field order (matches report
# `url` before `raw`) and JSON-LD keeps the key order the page wrote.
serde_json = { version = "1", features = ["preserve_order"], optional = true }
# Bucket search. Linear-time matching, so no user pattern can hang a scan.
regex = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Build with `--no-default-features`: a bin shares its package's dependencies, so with
# the `extension` feature on, cargo compiles ~180 crates the wrapper never uses.
[[bin]]
name = "onyxweb_wrapper"
path = "src/bin/onyxweb_wrapper.rs"

# Wrapper-only dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
ur-taking-me-with-you = "8"
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
ur-taking-me-with-you = "8"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Security","Win32_System_Diagnostics_ToolHelp","Win32_System_JobObjects","Win32_System_Threading"] }
